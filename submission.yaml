submission:
  title: "GridWise AI — Grid Load Optimisation & Renewable Energy Performance Advisor"

  problem_statement: >
    Electricity-grid operators face growing challenges balancing supply and demand
    as solar and wind energy become a larger share of generation. Renewables are
    weather-dependent and unpredictable, creating risks of demand spikes, generation
    shortfalls, and unnecessary curtailment of clean energy. Operators lack
    integrated, AI-assisted tools to forecast demand, detect renewable asset
    underperformance, and generate actionable optimisation plans in real time.

  solution_summary: >
    GridWise AI is a web-based AI-powered decision-support platform that integrates
    demand forecasting, renewable asset monitoring, anomaly detection, root-cause
    analysis, and curtailment optimisation into a single operator dashboard.
    It uses transparent rule-based AI to generate natural-language insights and
    prioritised recommendations — helping grid operators make faster, better-informed
    decisions without replacing human judgement. Built with React, Vite, and Recharts,
    the entire application runs in the browser with no external API dependencies.

  key_features:
    - "AI-powered demand forecasting using Weighted Moving Average with hour-of-day, day-of-week, and temperature adjustment factors, producing confidence intervals that widen from ±4% to ±13% over the 24-hour horizon"
    - "Statistical anomaly detection for 6 renewable assets (3 solar, 3 wind) using Z-score (|z| > 2.5) and threshold methods (actual < 70% expected), with automated root-cause analysis and ranked probable causes"
    - "Real-time grid balance monitoring with surplus/deficit gauge, generation mix donut chart, reserve margin indicator, and risk period timeline"
    - "AI Curtailment Minimisation Plan with quantified recovery potential across flexible load shifting, grid-scale storage dispatch, interconnector export, and conventional generation reduction strategies"
    - "One-click Operator Brief generator producing a printable 9-section structured operational report (Sections A–I) with live simulation data, plus a 10-step guided Demo Mode for hackathon presentations"

  tech_stack:
    languages: ["JavaScript ES2022", "JSX", "CSS3"]
    frameworks: ["React 18", "Vite 4", "Recharts 2.8"]
    ibm_technologies: ["IBM BoB (development and AI assistance platform)"]
    databases: []
    other: ["Simulated time-series data (48h × 30-min intervals)", "Rule-based NLG", "Z-score statistical detection", "Weighted Moving Average forecasting"]

  what_we_are_most_proud_of: >
    The integrated end-to-end reactive experience — from a demand spike triggering
    in Data Simulation, through anomaly detection flagging Solar Farm Alpha, to the
    Operator Brief generating a complete structured 9-section report with root-cause
    analysis and prioritised actions. Every module is connected to the same reactive
    simulation state, so every scenario change instantly propagates across all 9 pages,
    all charts, all KPIs, all alerts, and all AI recommendations simultaneously.
    The entire workflow runs in the browser with zero external dependencies or API keys.

  known_limitations: >
    All data is simulated programmatically — no connection to a real power grid,
    live sensors, or meteorological data feeds. AI uses transparent rule-based logic,
    not a trained machine-learning model or generative AI. Forecasting accuracy
    metrics (MAE/RMSE) compare against simulated baselines, not real historical
    data. The application is a prototype for demonstration purposes only and is
    not intended to control or automate real grid infrastructure.

